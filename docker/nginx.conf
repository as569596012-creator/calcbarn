server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # gzip 压缩静态资源(工具站 Core Web Vitals 友好)
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    # 因为 next.config 使用 trailingSlash,页面以 /path/index.html 形式存在
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # 不可变的 Next 静态资源长缓存
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SEO 文件正确的 content-type
    location = /sitemap.xml { add_header Content-Type application/xml; }
    location = /robots.txt  { add_header Content-Type text/plain; }
    location = /llms.txt     { add_header Content-Type text/plain; }

    error_page 404 /404.html;
}
